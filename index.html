<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новелла</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="game-container">
        <!-- Обертка для картинки, удерживающая её нижний край на ~42% высоты экрана -->
        <div class="image-wrapper">
            <img id="scene-image" class="hidden" alt="Кадр">
        </div>

        <!-- Текст, прилипающий к картинке -->
        <div id="story-text">Загрузка...</div>

        <!-- Контейнер для динамического числа кнопок -->
        <div id="choices-container"></div>
    </div>

    <!-- Аудио плеер -->
    <audio id="voice-player" class="hidden"></audio>

    <script src="js/brain.js"></script>
</body>
</html>
